name: Build POTATO GRAPHICS FF APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Check project ZIP
        run: |
          test -f PotatoGraphicsFF_v2.0_GitHub_Actions.zip
          unzip -t PotatoGraphicsFF_v2.0_GitHub_Actions.zip

      - name: Extract project
        run: |
          unzip -o PotatoGraphicsFF_v2.0_GitHub_Actions.zip -d project

      - name: Check project files
        run: |
          test -f project/PotatoGraphicsFF_v2.0/settings.gradle
          test -f project/PotatoGraphicsFF_v2.0/app/build.gradle
          test -f project/PotatoGraphicsFF_v2.0/app/src/main/AndroidManifest.xml

      - name: Build Debug APK
        working-directory: project/PotatoGraphicsFF_v2.0
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: POTATO-GRAPHICS-FF-APK
          path: project/PotatoGraphicsFF_v2.0/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
